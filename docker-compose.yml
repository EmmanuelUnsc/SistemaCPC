# Base de datos de desarrollo del Sistema CPC.
# La primera vez: docker compose up -d
# Después arranca sola cada vez que se abre Docker Desktop (restart: always).
services:
  postgres:
    image: postgres:17
    container_name: sistemacpc-db
    restart: always
    environment:
      POSTGRES_DB: sistemacpc
      POSTGRES_USER: cpc
      POSTGRES_PASSWORD: cpc_dev
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:
